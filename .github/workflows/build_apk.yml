name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'assets/**'
      - '.github/workflows/build_apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instalar Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # 3. Regenerar carpeta android (nombre de proyecto explícito para
      #    evitar el error "Latin-Delight- is not a valid Dart package name")
      - name: Create android platform folder
        run: flutter create --platforms=android --project-name=latin_delight_app .

      # 4. Ajustar versiones de AGP / Kotlin / Gradle
      - name: Set Gradle wrapper version
        run: |
          sed -i 's/distributionUrl=.*/distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-8.4-all.zip/' android/gradle/wrapper/gradle-wrapper.properties

      - name: Set AGP and Kotlin versions
        run: |
          sed -i 's/id "com.android.application" version ".*" apply false/id "com.android.application" version "8.3.0" apply false/' android/settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*" apply false/id "org.jetbrains.kotlin.android" version "1.9.22" apply false/' android/settings.gradle

      # 5. Activar plugin de Google Services + copiar google-services.json
      - name: Add Google Services plugin
        run: |
          sed -i '/id "org.jetbrains.kotlin.android"/a\    id "com.google.gms.google-services" version "4.5.0" apply false' android/settings.gradle
          sed -i '/id "com.android.application"/a\    id "com.google.gms.google-services"' android/app/build.gradle

      # 6. Corregir el applicationId para que coincida con el paquete
      #    registrado en Firebase (com.latindelight.app), y ajustar
      #    compileSdk / NDK. Se manejan AMBAS sintaxis posibles
      #    ("compileSdk X" y "compileSdk = X") porque distintas
      #    versiones de la plantilla de Flutter usan una u otra.
      - name: Fix application ID and SDK versions
        run: |
          sed -i 's/com\.example\.latin_delight_app/com.latindelight.app/g' android/app/build.gradle
          sed -i \
            -e 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' \
            -e 's/compileSdk flutter.compileSdkVersion/compileSdk 35/' \
            -e 's/ndkVersion = flutter.ndkVersion/ndkVersion = "25.1.8937393"/' \
            -e 's/ndkVersion flutter.ndkVersion/ndkVersion "25.1.8937393"/' \
            android/app/build.gradle

      - name: Copy google-services.json
        run: cp firebase-config/google-services.json android/app/google-services.json

      # 7. flutter pub get
      - name: Install dependencies
        run: flutter pub get

      # 8. Generar ícono de la app (debe ir después de crear android/
      #    y antes de compilar, si no el ícono no se aplica)
      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      # 9. Compilar APK
      - name: Build APK
        run: flutter build apk --release

      # 10. Subir como artifact descargable
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: latin-delight-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # 11. Verificación: mostrar build.gradle final en el log,
      #     útil para depurar rápido si algo vuelve a fallar
      - name: Debug gradle files (solo si falla algo más adelante)
        if: failure()
        run: |
          echo "----- settings.gradle -----"
          cat android/settings.gradle
          echo "----- app/build.gradle -----"
          cat android/app/build.gradle 
